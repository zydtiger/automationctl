[project]
name = "automationctl"
version = "0.4.2"
description = "Agent-neutral automation runner compiling declarative task specs to systemd and launchd"
readme = "README.md"
license = "MIT"
authors = [
  { name = "zydtiger" },
]
requires-python = ">=3.11"
dependencies = [
  "typer>=0.21,<1",
]

[project.scripts]
automationctl = "automationctl.cli:entrypoint"
actl = "automationctl.cli:entrypoint"

[build-system]
requires = ["uv_build>=0.11.28,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy>=1.19,<3",
  "psutil>=7,<8",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
  "types-psutil>=7.2.2.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
